name: ANTARA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      suite:
        description: Scheduled suite to run manually
        required: true
        type: choice
        options: [nightly, weekly]
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'
    # Weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

concurrency:
  # Pushes and the two schedules must never cancel one another.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ github.event.schedule || inputs.suite || 'unscheduled' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PYTHONPATH: ${{ github.workspace }}/src
  MPLBACKEND: 'Agg'

jobs:
  # ============================================================
  # Smoke tests (push / PR) - fast syntax and import checks
  # ============================================================
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            ppigrf=2.1.0
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Verify environment
        run: |
          which python
          python --version
          python -m pip --version
          python - <<'PY'
          import orekit
          print("Orekit import OK")
          print("Orekit module:", orekit.__file__)
          PY

      - name: Install and verify physics dependencies
        run: |
          python -m pip install spacepy==0.7.0
          python scripts/verify_physics_dependencies.py --require-ci-env

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit JVM initialized")
          print("Orekit data downloaded")
          PY

      - name: Syntax check all Python sources recursively
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(src/**/*.py)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No Python files found under src/"
            exit 1
          fi

          for f in "${files[@]}"; do
            python -m py_compile "$f"
            echo "OK: $f"
          done

      - name: Import test
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from simulations.ditl.ANTARA_Science_Sim import MissionConfig, ANTARAScienceSimulator
          print("ANTARA_Science_Sim imports OK")

          from simulations.legacy.ANTARA_Master import MissionConfig, ANTARASimulator
          print("ANTARA_Master imports OK")

          from simulations.detumble.leop_detumble_mc import run_single_trial, run_monte_carlo
          print("leop_detumble_mc imports OK")

          from simulations.ditl.compare_scenarios import load_scenario_data
          print("compare_scenarios imports OK")

          from simulations.ditl.scenarios import build_scenario
          print("scenarios imports OK")

          from simulations.helper.antara_models import MissionConfig, ADCSModel, SpacecraftFSM
          print("antara_models imports OK")
          PY

  # ============================================================
  # Unit tests (push / PR)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: smoke-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            ppigrf=2.1.0
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Install and verify physics dependencies
        run: |
          python -m pip install spacepy==0.7.0
          python scripts/verify_physics_dependencies.py --require-ci-env

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit data OK")
          PY

      - name: Run FSM spec drift guard test
        run: |
          python -m pytest tests/test_fsm_spec_matches_code.py -v --tb=short

      - name: Physics and attitude regression tests
        run: python -m pytest tests/test_physics_attitude.py tests/test_scientific_integrity.py tests/test_execution_integrity.py tests/test_audit_repairs.py tests/test_slew_profile.py tests/test_wheel_events.py tests/test_telemetry_integrity.py tests/test_checkpoint_roundtrip.py tests/test_detumble_multiprocessing.py tests/test_scheduled_validation.py tests/test_simulation_layout.py tests/test_repository_hygiene.py -v --tb=short

      - name: Syntax check validation tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/validation/test_*.py)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No validation test files found under tests/validation/"
            exit 1
          fi

          for f in "${files[@]}"; do
            python -m py_compile "$f"
            echo "OK: $f"
          done

  # ============================================================
  # Scenario smoke tests (push / PR) - 1 simulated hour each
  # ============================================================
  scenario-smoke:
    name: Scenario Smoke Tests (1h sim)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: smoke-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    defaults:
      run:
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        scenario: [leop_24h, no_leop_24h]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            ppigrf=2.1.0
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Install and verify physics dependencies
        run: |
          python -m pip install spacepy==0.7.0
          python scripts/verify_physics_dependencies.py --require-ci-env

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit data OK")
          PY

      - name: Run scenario ${{ matrix.scenario }} (1 hour)
        run: |
          python src/simulations/ditl/ANTARA_Science_Sim.py \
            --scenario "${{ matrix.scenario }}" \
            --duration-hours 1 \
            --step-sec 2.0 \
            --no-plots
        timeout-minutes: 12

      - name: Verify outputs
        run: |
          telemetry="results/science/${{ matrix.scenario }}_ANTARA_Science_telemetry.csv"
          test -f "$telemetry"
          ls -lh "$telemetry"

          python - <<'PY'
          import pandas as pd
          import numpy as np

          scenario = "${{ matrix.scenario }}"
          path = f"results/science/{scenario}_ANTARA_Science_telemetry.csv"

          df = pd.read_csv(path)

          print(f"Rows: {len(df)}")
          print(f"Columns: {list(df.columns)}")

          assert len(df) > 0, "No telemetry data"
          assert "mode" in df.columns, "Telemetry is missing required 'mode' column"

          elapsed = df["time_sec"] - df["time_sec"].iloc[0]
          assert np.isclose(df.time_sec.iloc[0], 0, rtol=0, atol=1e-7), "Unexpected start time"
          assert np.isclose(elapsed.iloc[-1], 3600, rtol=0, atol=1e-7), elapsed.iloc[-1]
          gaps = elapsed.diff().dropna().to_numpy()
          assert ((gaps > 0) & (gaps <= 2.0 + 1e-9)).all(), "Invalid telemetry interval"
          assert np.allclose(df.interval_duration_sec.iloc[:-1], gaps, rtol=0, atol=1e-7), "Interval/clock mismatch"
          assert np.allclose(df.state_time_sec, df.time_sec + df.interval_duration_sec, rtol=0, atol=1e-7), "State/clock mismatch"
          assert np.isclose(df.interval_duration_sec.sum(), 3600, rtol=0, atol=1e-7), "Incorrect integrated duration"
          assert df.interval_duration_sec.iloc[-1] == 0, "Terminal row integrated again"
          short = gaps < 2.0 - 1e-9
          # Only wheel events or the final horizon clip may shorten fixed stepping.
          assert (df.wheel_event_split.iloc[:-2].to_numpy() | ~short[:-1]).all(), "Unexplained short interval"

          print(f"Modes: {df['mode'].unique()}")
          PY

  # ============================================================
  # FSM Diagram generation (push / PR)
  # ============================================================
  fsm-diagram:
    name: FSM Diagram Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke-test
    if: github.event_name == 'push' || github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python Graphviz package
        run: |
          python -m pip install --upgrade pip
          python -m pip install graphviz

      - name: Generate FSM diagrams
        run: |
          python src/simulations/ditl/plot_fsm_diagram.py --output-dir src/simulations/ditl --format both

      - name: Verify outputs
        run: |
          test -f src/simulations/ditl/fsm_diagram.png
          test -f src/simulations/ditl/fsm_diagram.svg
          test -f src/simulations/ditl/fsm_diagram.mmd

          ls -lh \
            src/simulations/ditl/fsm_diagram.png \
            src/simulations/ditl/fsm_diagram.svg \
            src/simulations/ditl/fsm_diagram.mmd

          head -20 src/simulations/ditl/fsm_diagram.mmd

      - name: Upload diagrams as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fsm-diagrams
          path: src/simulations/ditl/fsm_diagram.*
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # Nightly full tests - every day at 02:00 UTC
  # ============================================================
  nightly-full:
    name: Nightly Full Tests
    runs-on: [self-hosted, Linux, X64, antara-nightly]
    # Stay below the 24-hour GITHUB_TOKEN refresh limit, including uploads.
    timeout-minutes: 1380
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && ((github.event_name == 'schedule' && github.event.schedule == '0 2 * * *') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'nightly'))
    concurrency:
      group: antara-local-nightly
      cancel-in-progress: false

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            ppigrf=2.1.0
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Verify environment
        run: |
          which python
          python --version
          python - <<'PY'
          import orekit
          print("Orekit import OK")
          PY

      - name: Install and verify physics dependencies
        run: |
          python -m pip install spacepy==0.7.0
          python scripts/verify_physics_dependencies.py --require-ci-env

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit data OK")
          PY

      - name: Full leop_24h scenario
        run: |
          python src/simulations/ditl/ANTARA_Science_Sim.py --scenario leop_24h
        timeout-minutes: 30

      - name: Full no_leop_24h scenario
        run: |
          python src/simulations/ditl/ANTARA_Science_Sim.py --scenario no_leop_24h
        timeout-minutes: 30

      - name: Full leop_1yr scenario (with multi-rate)
        run: |
          # Step timeout-minutes is capped at 360 by Actions. GNU timeout
          # supplies a bounded 20-hour window inside the 23-hour job instead.
          timeout --signal=INT --kill-after=5m 20h \
            python -u src/simulations/ditl/ANTARA_Science_Sim.py --scenario leop_1yr

      - name: LEOP Detumble MC (n_trials=5000)
        run: |
          python src/simulations/detumble/leop_detumble_mc.py \
            --n-trials 5000 \
            --output detumble_mc_results.pkl
        timeout-minutes: 60

      - name: Analyze MC results
        run: |
          python src/simulations/detumble/analyze_detumble_mc.py \
            detumble_mc_results.pkl \
            --output-dir detumble_analysis

      - name: Run validation suite
        run: |
          python scripts/generate_validation_report.py
        timeout-minutes: 30

      - name: Scenario comparison
        run: |
          python src/simulations/ditl/compare_scenarios.py \
            --require-all \
            --require-full-duration \
            --results-dir results/science \
            --output-dir figures/science

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results
          path: |
            results/
            figures/
            detumble_analysis/
            detumble_mc_results.pkl
            results/validation/
          retention-days: 90
          if-no-files-found: warn

      - name: Upload FSM diagrams
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-fsm-diagrams
          path: src/simulations/ditl/fsm_diagram.*
          retention-days: 90
          if-no-files-found: warn

  # ============================================================
  # Weekly validation - Sundays at 03:00 UTC
  # ============================================================
  weekly-validation:
    name: Weekly Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0') || (github.event_name == 'workflow_dispatch' && inputs.suite == 'weekly')

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            ppigrf=2.1.0
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Install and verify physics dependencies
        run: |
          python -m pip install spacepy==0.7.0
          python scripts/verify_physics_dependencies.py --require-ci-env

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit data OK")
          PY

      - name: Run all validation tests
        run: |
          python scripts/generate_validation_report.py
        timeout-minutes: 45

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: results/validation/VALIDATION_REPORT.md
          retention-days: 90
          if-no-files-found: warn

      - name: Upload validation JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-data
          path: |
            results/validation/validation_results_*.json
            results/validation/*.log
          retention-days: 90
          if-no-files-found: warn
