name: ANTARA CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'
    # Weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.11'
  PYTHONPATH: ${{ github.workspace }}/src
  MPLBACKEND: 'Agg'

jobs:
  # ============================================================
  # Smoke tests (push / PR) - fast syntax and import checks
  # ============================================================
  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name != 'schedule'

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Verify environment
        run: |
          which python
          python --version
          python -m pip --version
          python - <<'PY'
          import orekit
          print("Orekit import OK")
          print("Orekit module:", orekit.__file__)
          PY

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit JVM initialized")
          print("Orekit data downloaded")
          PY

      - name: Syntax check all src/*.py
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(src/*.py)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No Python files found under src/"
            exit 1
          fi

          for f in "${files[@]}"; do
            python -m py_compile "$f"
            echo "OK: $f"
          done

      - name: Import test
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from ANTARA_Science_Sim import MissionConfig, ANTARAScienceSimulator
          print("ANTARA_Science_Sim imports OK")

          from ANTARA_Master import MissionConfig, ANTARASimulator
          print("ANTARA_Master imports OK")

          from leop_detumble_mc import run_single_trial, run_monte_carlo
          print("leop_detumble_mc imports OK")

          from compare_scenarios import load_scenario_data
          print("compare_scenarios imports OK")

          from scenarios import build_scenario
          print("scenarios imports OK")

          from antara_models import MissionConfig, ADCSModel, SpacecraftFSM
          print("antara_models imports OK")
          PY

  # ============================================================
  # Unit tests (push / PR)
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: smoke-test
    if: github.event_name != 'schedule'

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit data OK")
          PY

      - name: Run FSM spec drift guard test
        run: |
          python -m pytest tests/test_fsm_spec_matches_code.py -v --tb=short

      - name: Syntax check validation tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/validation/test_*.py)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No validation test files found under tests/validation/"
            exit 1
          fi

          for f in "${files[@]}"; do
            python -m py_compile "$f"
            echo "OK: $f"
          done

  # ============================================================
  # Scenario smoke tests (push / PR) - 1 simulated hour each
  # ============================================================
  scenario-smoke:
    name: Scenario Smoke Tests (1h sim)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: smoke-test
    if: github.event_name != 'schedule'

    defaults:
      run:
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        scenario: [leop_24h, no_leop_24h]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit data OK")
          PY

      - name: Run scenario ${{ matrix.scenario }} (1 hour)
        run: |
          python src/ANTARA_Science_Sim.py \
            --scenario "${{ matrix.scenario }}" \
            --duration-hours 1 \
            --step-sec 2.0 \
            --no-plots
        timeout-minutes: 12

      - name: Verify outputs
        run: |
          telemetry="results/science/${{ matrix.scenario }}_ANTARA_Science_telemetry.csv"
          test -f "$telemetry"
          ls -lh "$telemetry"

          python - <<'PY'
          import pandas as pd

          scenario = "${{ matrix.scenario }}"
          path = f"results/science/{scenario}_ANTARA_Science_telemetry.csv"

          df = pd.read_csv(path)

          print(f"Rows: {len(df)}")
          print(f"Columns: {list(df.columns)}")

          assert len(df) > 0, "No telemetry data"
          assert "mode" in df.columns, "Telemetry is missing required 'mode' column"

          print(f"Modes: {df['mode'].unique()}")
          PY

  # ============================================================
  # FSM Diagram generation (push / PR)
  # ============================================================
  fsm-diagram:
    name: FSM Diagram Generation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: smoke-test
    if: github.event_name != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python Graphviz package
        run: |
          python -m pip install --upgrade pip
          python -m pip install graphviz

      - name: Generate FSM diagrams
        run: |
          mkdir -p docs
          python src/plot_fsm_diagram.py --output-dir docs --format both

      - name: Verify outputs
        run: |
          test -f docs/fsm_diagram.png
          test -f docs/fsm_diagram.svg
          test -f docs/fsm_diagram.mmd

          ls -lh \
            docs/fsm_diagram.png \
            docs/fsm_diagram.svg \
            docs/fsm_diagram.mmd

          head -20 docs/fsm_diagram.mmd

      - name: Upload diagrams as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: fsm-diagrams
          path: docs/fsm_diagram.*
          retention-days: 30
          if-no-files-found: error

  # ============================================================
  # Nightly full tests - every day at 02:00 UTC
  # ============================================================
  nightly-full:
    name: Nightly Full Tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 * * *'

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Verify environment
        run: |
          which python
          python --version
          python - <<'PY'
          import orekit
          print("Orekit import OK")
          PY

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit data OK")
          PY

      - name: Full leop_24h scenario
        run: |
          python src/ANTARA_Science_Sim.py --scenario leop_24h
        timeout-minutes: 30

      - name: Full no_leop_24h scenario
        run: |
          python src/ANTARA_Science_Sim.py --scenario no_leop_24h
        timeout-minutes: 30

      - name: Full leop_1yr scenario (with multi-rate)
        run: |
          python src/ANTARA_Science_Sim.py --scenario leop_1yr
        timeout-minutes: 60

      - name: LEOP Detumble MC (n_trials=5000)
        run: |
          python src/leop_detumble_mc.py \
            --n-trials 5000 \
            --output detumble_mc_results.pkl
        timeout-minutes: 60

      - name: Analyze MC results
        run: |
          python src/analyze_detumble_mc.py \
            detumble_mc_results.pkl \
            --output-dir detumble_analysis

      - name: Run validation suite
        run: |
          python scripts/generate_validation_report.py
        timeout-minutes: 30

      - name: Scenario comparison
        run: |
          python src/compare_scenarios.py \
            --results-dir results/science \
            --output-dir figures/science

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-results
          path: |
            results/
            figures/
            detumble_analysis/
            detumble_mc_results.pkl
            validation_results_*.json
            VALIDATION_REPORT.md
          retention-days: 90
          if-no-files-found: warn

      - name: Upload FSM diagrams
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-fsm-diagrams
          path: docs/fsm_diagram.*
          retention-days: 90
          if-no-files-found: warn

  # ============================================================
  # Weekly validation - Sundays at 03:00 UTC
  # ============================================================
  weekly-validation:
    name: Weekly Validation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0'

    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up ANTARA environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: antara
          create-args: >-
            python=${{ env.PYTHON_VERSION }}
            orekit
            numpy
            pandas
            matplotlib
            cartopy
            shapely
            scipy
            skyfield
            pytest
            pip
            -c conda-forge

      - name: Set up Orekit data
        run: |
          python - <<'PY'
          import orekit
          orekit.initVM()

          from orekit.pyhelpers import download_orekit_data_curdir
          download_orekit_data_curdir()

          print("Orekit data OK")
          PY

      - name: Run all validation tests
        run: |
          python scripts/generate_validation_report.py
        timeout-minutes: 45

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: VALIDATION_REPORT.md
          retention-days: 90
          if-no-files-found: warn

      - name: Upload validation JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-data
          path: tests/validation/validation_results_*.json
          retention-days: 90
          if-no-files-found: warn